name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 */24 * * *"   # roda uma vez por dia
  workflow_dispatch:           # permite rodar manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate animated cards
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: node scripts/cards.mjs

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg assets/trophies.svg
          git diff --staged --quiet || git commit -m "chore: update github stats cards [skip ci]"
          git push
